<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="only light">
<meta name="referrer" content="no-referrer">
<title>Kommentarkort</title>
<style>
:root{
  --ground:#e8ece8; --card:#ffffff; --ink:#16201c; --ink-2:#46534d; --muted:#6f7b75; --line:#d5ddd7;
  --accent:#0d6b5b; --accent-ink:#ffffff; --bad:#b3261e;
  --shadow:0 1px 2px rgba(18,32,26,.07),0 10px 30px rgba(18,32,26,.13);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;place-items:center;padding-inline:16px;box-sizing:border-box}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 26px 24px;box-sizing:border-box}
h1{font-size:21px;line-height:1.2;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
p{margin:0 0 18px;color:var(--ink-2)}
label{display:block;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap}
button[disabled]{opacity:.6;cursor:progress}
#msg{min-height:1.4em;margin:10px 0 0;font-size:14px;color:var(--bad)}
#msg.info{color:var(--muted)}
.afsender{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center}
.afsender a{display:inline-block;border-radius:4px;opacity:.72;transition:opacity .2s}
.afsender a:hover,.afsender a:focus-visible{opacity:1}
.afsender img{display:block;width:132px;height:auto}
/* Logo-overgang som på jhn.dk (service-transition i jhn-modern-site/styles.css): baggrund 200 ms, logo tegnes frem 460 ms med grøn scanlinje */
:root{--paper:#f7f8f5}
.overgang{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:var(--paper);opacity:0;visibility:hidden;pointer-events:none}
.overgang.is-active{visibility:visible;animation:overgang-bg 200ms ease-out both}
.overgang-logo{position:relative;width:min(76vw,330px);overflow:hidden;opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(-10px) scale(.985)}
.overgang-logo img{display:block;width:100%;height:auto}
.overgang-logo::after{content:"";position:absolute;left:0;top:13%;bottom:13%;width:2px;background:#009539;opacity:0;transform:translateX(-1px)}
.overgang.is-active .overgang-logo{animation:overgang-logo 460ms cubic-bezier(.22,1,.36,1) 110ms both}
.overgang.is-active .overgang-logo::after{animation:overgang-scan 460ms cubic-bezier(.22,1,.36,1) 110ms both}
@keyframes overgang-bg{0%{opacity:0}100%{opacity:1}}
@keyframes overgang-logo{0%{opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(-10px) scale(.985)}12%{opacity:1}82%,100%{opacity:1;clip-path:inset(0 0 0 0);transform:translateX(0) scale(1)}}
@keyframes overgang-scan{0%{left:0;opacity:0}10%{opacity:.9}72%{opacity:.8}82%{left:calc(100% - 2px);opacity:.5}100%{left:calc(100% - 2px);opacity:0}}
@media (prefers-reduced-motion: reduce){ .overgang{display:none} }
</style>
</head>

  const f = document.getElementById('f'), inp = document.getElementById('kode'), knap = document.getElementById('knap'), msg = document.getElementById('msg');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const say = (t, info) => { msg.textContent = t; msg.className = info ? 'info' : ''; };
  if (!(window.crypto && crypto.subtle)) {
    say('Din browser kan ikke åbne siden. Brug en nyere browser, og åbn siden via https.');
    knap.disabled = true; return;
  }
  async function aabn(kode){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(kode), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
    return new TextDecoder().decode(pt);
  }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ov = document.querySelector('.overgang'), logoSrc = document.querySelector('.afsender img').src;
  ov.querySelector('img').src = logoSrc;
  const pause = ms => new Promise(r => setTimeout(r, ms));
  // Kortsiden starter med det færdigtegnede logo øverst, så der ikke er en tom skærm, mens kortværktøjet hentes.
  // Logoet toner ud, så snart kortets eget script har tegnet kortet (scriptet i bunden kører først derefter).
  // Det venter IKKE på browserens load-hændelse (den kan trække ud pga. skrifttyper), og det tager aldrig imod klik.
  function medLogo(html){
    const top = '<style>.jhn-overgang{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:24px;background:#f7f8f5;pointer-events:none;transition:opacity .35s ease,visibility .35s}'
      + '.jhn-overgang img{display:block;width:min(76vw,330px);height:auto}.jhn-overgang.ud{opacity:0;visibility:hidden}'
      + '@media (prefers-reduced-motion: reduce){.jhn-overgang{transition:none}}</style>'
      + '<div class="jhn-overgang" aria-hidden="true"><img alt="" width="774" height="123" src="' + logoSrc + '"></div>'
      + '<script>window.__jhnUd=function(){var o=document.querySelector(".jhn-overgang");if(!o||o.classList.contains("ud"))return;o.classList.add("ud");setTimeout(function(){o.remove()},400)};setTimeout(window.__jhnUd,4000);<\/script>';
    const bund = '<script>setTimeout(window.__jhnUd,250);<\/script>';
    html = html.replace(/<body[^>]*>/, m => m + top);
    const i = html.lastIndexOf('</body>');
    return i >= 0 ? html.slice(0, i) + bund + html.slice(i) : html + bund;
  }
  function vis(html){ document.open(); document.write(medLogo(html)); document.close(); }
  async function proev(kode, stille){
    knap.disabled = true; if (!stille) say('Åbner kortet …', true);
    try {
      const html = await aabn(kode);
      try { sessionStorage.setItem('fors-kommentarkort-kode', kode); } catch(e) {}
      if (!stille && !reduce) { ov.classList.add('is-active'); await pause(700); }
      vis(html);
    } catch(e) {
      try { sessionStorage.removeItem('fors-kommentarkort-kode'); } catch(_) {}
      knap.disabled = false;
      if (!stille) { say('Koden passer ikke. Prøv igen.'); inp.select(); }
    }
  }
  // egen dansk besked i stedet for browserens indbyggede ("Please fill out this field" følger browserens sprog)
  f.addEventListener('submit', e => {
    e.preventDefault(); const k = inp.value;
    if (k) proev(k, false); else { say('Skriv koden fra rapporten.'); inp.focus(); }
  });
  // åbner igen uden kode, hvis siden genindlæses i samme browserfane
  let gemt = null; try { gemt = sessionStorage.getItem('fors-kommentarkort-kode'); } catch(e) {}
  if (gemt) proev(gemt, true);
})();
